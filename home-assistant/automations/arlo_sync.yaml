- id: camera_portail_arm_disarm_sync
  alias: "Camera Portail Arm/Disarm Sync"
  description: ''
  triggers:
  - trigger: state
    entity_id: input_boolean.camera_portail_armed
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.camera_portail_armed
        state: 'on'
      sequence:
      - action: rest_command.camera_portail_arm
        data:
          arm: true
    default:
    - action: rest_command.camera_portail_arm
      data:
        arm: false
  mode: single

